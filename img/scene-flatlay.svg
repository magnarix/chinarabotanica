<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Top-down flat lay on linen surface -->
  <rect width="800" height="600" fill="#F0ECE7"/>

  <!-- Subtle linen texture -->
  <g opacity="0.035">
    <line x1="0" y1="20" x2="800" y2="20" stroke="#A09888" stroke-width="0.3"/>
    <line x1="0" y1="40" x2="800" y2="40" stroke="#A09888" stroke-width="0.3"/>
    <line x1="0" y1="60" x2="800" y2="60" stroke="#A09888" stroke-width="0.3"/>
    <line x1="0" y1="80" x2="800" y2="80" stroke="#A09888" stroke-width="0.3"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#A09888" stroke-width="0.3"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#A09888" stroke-width="0.3"/>
    <line x1="0" y1="140" x2="800" y2="140" stroke="#A09888" stroke-width="0.3"/>
    <line x1="20" y1="0" x2="20" y2="600" stroke="#A09888" stroke-width="0.3"/>
    <line x1="40" y1="0" x2="40" y2="600" stroke="#A09888" stroke-width="0.3"/>
    <line x1="60" y1="0" x2="60" y2="600" stroke="#A09888" stroke-width="0.3"/>
  </g>

  <!-- Study tin (top-down view — circle) — center left -->
  <g transform="translate(300, 280)">
    <ellipse cx="0" cy="0" rx="48" ry="48" fill="#E8E3DC"/>
    <ellipse cx="0" cy="0" rx="48" ry="48" stroke="#D6D0C8" stroke-width="0.5" fill="none"/>
    <ellipse cx="0" cy="0" rx="40" ry="40" stroke="#E0DBD4" stroke-width="0.3" fill="none"/>
    <rect x="-20" y="-1" width="40" height="2" fill="#5A7A5A" rx="1"/>
    <text x="0" y="15" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#6B6560">Study</text>
    <!-- Tin shadow -->
    <ellipse cx="5" cy="5" rx="48" ry="48" fill="#D0CABC" opacity="0.15"/>
  </g>

  <!-- Scattered loose leaf tea — small dots cluster -->
  <g transform="translate(440, 240)" fill="#7A9A7A" opacity="0.4">
    <circle cx="0" cy="0" r="2"/>
    <circle cx="8" cy="3" r="1.5"/>
    <circle cx="-5" cy="6" r="1.8"/>
    <circle cx="12" cy="-4" r="1.3"/>
    <circle cx="3" cy="10" r="2"/>
    <circle cx="-8" cy="-3" r="1.6"/>
    <circle cx="16" cy="6" r="1.2"/>
    <circle cx="-2" cy="-8" r="1.4"/>
    <circle cx="10" cy="12" r="1.7"/>
    <circle cx="20" cy="0" r="1.5"/>
    <circle cx="-12" cy="10" r="1.3"/>
    <circle cx="6" cy="-10" r="1.8"/>
  </g>

  <!-- Rosemary sprig — angled -->
  <g transform="translate(520, 320) rotate(-30)" stroke="#6B8A6B" stroke-width="0.8" fill="none" opacity="0.45">
    <line x1="0" y1="60" x2="0" y2="-40"/>
    <path d="M0,40 Q-8,34 -6,26"/>
    <path d="M0,40 Q8,34 6,26"/>
    <path d="M0,25 Q-9,18 -7,10"/>
    <path d="M0,25 Q9,18 7,10"/>
    <path d="M0,10 Q-8,4 -6,-4"/>
    <path d="M0,10 Q8,4 6,-4"/>
    <path d="M0,-5 Q-7,-10 -5,-18"/>
    <path d="M0,-5 Q7,-10 5,-18"/>
    <path d="M0,-18 Q-5,-24 -4,-30"/>
    <path d="M0,-18 Q5,-24 4,-30"/>
  </g>

  <!-- Small ceramic dish with ginkgo leaves -->
  <g transform="translate(200, 180)">
    <ellipse cx="0" cy="0" rx="36" ry="36" fill="#F5F0EA" stroke="#E0DBD4" stroke-width="0.5"/>
    <!-- Ginkgo leaf shapes -->
    <g fill="#8AA88A" opacity="0.25">
      <path d="M-5,0 Q-15,-20 0,-18 Q15,-20 5,0 Q0,-5 -5,0"/>
      <path d="M8,5 Q0,-12 14,-10 Q28,-12 18,5 Q13,0 8,5" transform="rotate(30, 13, -2)"/>
    </g>
  </g>

  <!-- Measuring spoon -->
  <g transform="translate(500, 150) rotate(15)">
    <rect x="0" y="0" width="80" height="5" rx="2.5" fill="#D8D2CA"/>
    <ellipse cx="-10" cy="2.5" rx="14" ry="10" fill="#E0DBD4" stroke="#D0CABC" stroke-width="0.5"/>
    <!-- Tea in spoon -->
    <ellipse cx="-10" cy="3" rx="10" ry="7" fill="#7A9A7A" opacity="0.2"/>
  </g>

  <!-- Small linen swatch / cloth corner -->
  <g transform="translate(600, 380)">
    <rect x="0" y="0" width="100" height="120" fill="#E8E2D8" rx="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="100" y2="0" stroke="#D6D0C8" stroke-width="0.5"/>
  </g>

  <!-- Cup top-down -->
  <g transform="translate(160, 420)">
    <ellipse cx="0" cy="0" rx="32" ry="32" fill="#EDE9E3" stroke="#DDD8D1" stroke-width="0.5"/>
    <ellipse cx="0" cy="0" rx="26" ry="26" fill="#F2EEE9" stroke="#E4DFD8" stroke-width="0.3"/>
    <ellipse cx="0" cy="0" rx="22" ry="22" fill="#C8B898" opacity="0.2"/>
    <!-- Handle shadow -->
    <path d="M32,0 Q48,-4 48,0 Q48,4 32,0" fill="#D8D2CA" opacity="0.3"/>
  </g>

  <!-- Cinnamon stick -->
  <g transform="translate(380, 440) rotate(-8)">
    <rect x="0" y="0" width="70" height="6" rx="3" fill="#B8907A" opacity="0.35"/>
    <rect x="0" y="8" width="65" height="5" rx="2.5" fill="#B8907A" opacity="0.25"/>
  </g>
</svg>
