<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Warm neutral background — soft light from left -->
  <rect width="800" height="600" fill="#F5F2EE"/>
  <rect width="800" height="600" fill="url(#warmLight)" opacity="0.4"/>
  <defs>
    <radialGradient id="warmLight" cx="0.2" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#EDE8E0"/>
    </radialGradient>
  </defs>

  <!-- Desk surface -->
  <rect x="0" y="360" width="800" height="240" fill="#E8E3DC"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#DDD8D1" stroke-width="1"/>

  <!-- Soft shadow on desk -->
  <ellipse cx="400" cy="440" rx="300" ry="60" fill="#DDD8D1" opacity="0.3"/>

  <!-- Notebook (open, flat) -->
  <g transform="translate(180, 370)">
    <rect x="0" y="0" width="120" height="160" rx="2" fill="#F0ECE7" stroke="#E0DBD4" stroke-width="0.5"/>
    <rect x="125" y="0" width="120" height="160" rx="2" fill="#F2EEE9" stroke="#E0DBD4" stroke-width="0.5"/>
    <!-- Spine -->
    <line x1="122" y1="0" x2="122" y2="160" stroke="#D6D0C8" stroke-width="1.5"/>
    <!-- Written lines -->
    <line x1="135" y1="30" x2="230" y2="30" stroke="#D8D2CA" stroke-width="0.5"/>
    <line x1="135" y1="42" x2="225" y2="42" stroke="#D8D2CA" stroke-width="0.5"/>
    <line x1="135" y1="54" x2="215" y2="54" stroke="#D8D2CA" stroke-width="0.5"/>
    <line x1="135" y1="66" x2="220" y2="66" stroke="#D8D2CA" stroke-width="0.5"/>
    <line x1="135" y1="78" x2="200" y2="78" stroke="#D8D2CA" stroke-width="0.5"/>
  </g>

  <!-- Pen -->
  <g transform="translate(440, 415) rotate(-12)">
    <rect x="0" y="0" width="100" height="4" rx="2" fill="#4A4540" opacity="0.6"/>
    <rect x="0" y="0" width="8" height="4" rx="2" fill="#6B6560"/>
  </g>

  <!-- Tea cup — ceramic -->
  <g transform="translate(560, 380)">
    <!-- Shadow -->
    <ellipse cx="0" cy="80" rx="40" ry="6" fill="#D6D0C8" opacity="0.4"/>
    <!-- Cup body -->
    <path d="M-35,20 L-30,75 Q0,85 30,75 L35,20 Z" fill="#EDE9E3" stroke="#DDD8D1" stroke-width="0.5"/>
    <!-- Cup rim -->
    <ellipse cx="0" cy="20" rx="36" ry="10" fill="#F2EEE9" stroke="#DDD8D1" stroke-width="0.5"/>
    <!-- Tea liquid -->
    <ellipse cx="0" cy="22" rx="30" ry="8" fill="#C8B898" opacity="0.35"/>
    <!-- Handle -->
    <path d="M35,30 Q55,30 55,50 Q55,68 35,68" stroke="#DDD8D1" stroke-width="2" fill="none"/>
    <!-- Steam wisps -->
    <path d="M-5,8 Q-8,-5 -3,-18" stroke="#D8D2CA" stroke-width="0.5" fill="none" opacity="0.5"/>
    <path d="M5,6 Q8,-8 3,-22" stroke="#D8D2CA" stroke-width="0.5" fill="none" opacity="0.4"/>
    <path d="M0,10 Q-2,-2 2,-15" stroke="#D8D2CA" stroke-width="0.5" fill="none" opacity="0.3"/>
  </g>

  <!-- Study tin — on desk, right side -->
  <g transform="translate(680, 365)">
    <ellipse cx="0" cy="115" rx="22" ry="4" fill="#D6D0C8" opacity="0.4"/>
    <rect x="-22" y="0" width="44" height="112" rx="1" fill="#E8E3DC"/>
    <rect x="-22" y="0" width="1.5" height="112" fill="#F0ECE7"/>
    <rect x="20.5" y="0" width="1.5" height="112" fill="#D6D0C8"/>
    <ellipse cx="0" cy="0" rx="22" ry="6" fill="#EDE9E3"/>
    <ellipse cx="0" cy="112" rx="22" ry="6" fill="#DDD8D1"/>
    <rect x="-22" y="52" width="44" height="2" fill="#5A7A5A"/>
    <text x="0" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#6B6560">Study</text>
  </g>

  <!-- Soft plant shadow in corner -->
  <g transform="translate(50, 200)" opacity="0.12">
    <path d="M0,160 Q5,100 -20,50 Q-5,80 0,160" fill="#5A7A5A"/>
    <path d="M0,160 Q15,90 40,40 Q20,75 0,160" fill="#5A7A5A"/>
    <path d="M0,160 Q-10,110 -35,70 Q-10,95 0,160" fill="#5A7A5A"/>
  </g>

  <!-- Ambient light glow -->
  <circle cx="120" cy="180" r="120" fill="#FAF6F0" opacity="0.15"/>
</svg>
