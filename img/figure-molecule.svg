<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <rect width="800" height="320" fill="#F5F3EE"/>

  <!-- Abstract marine polysaccharide chain (fucoidan-inspired) -->
  <g stroke="#2B5A54" stroke-width="1.4" fill="none" opacity="0.7">
    <!-- backbone -->
    <path d="M60 200 L140 140 L220 200 L300 140 L380 200 L460 140 L540 200 L620 140 L700 200"/>
    <!-- ring hexagons at each node -->
    <g stroke-width="1.2">
      <path d="M132 140 l8 -14 l16 0 l8 14 l-8 14 l-16 0 z"/>
      <path d="M292 140 l8 -14 l16 0 l8 14 l-8 14 l-16 0 z"/>
      <path d="M452 140 l8 -14 l16 0 l8 14 l-8 14 l-16 0 z"/>
      <path d="M612 140 l8 -14 l16 0 l8 14 l-8 14 l-16 0 z"/>
    </g>
  </g>

  <!-- substituent nodes (sulfate / fucose groups) in algae gold -->
  <g fill="#A6884F" opacity="0.75">
    <circle cx="60" cy="200" r="5"/>
    <circle cx="220" cy="200" r="5"/>
    <circle cx="380" cy="200" r="5"/>
    <circle cx="540" cy="200" r="5"/>
    <circle cx="700" cy="200" r="5"/>
  </g>
  <g fill="#2B5A54" opacity="0.5">
    <circle cx="140" cy="112" r="3.4"/>
    <circle cx="300" cy="112" r="3.4"/>
    <circle cx="460" cy="112" r="3.4"/>
    <circle cx="620" cy="112" r="3.4"/>
  </g>

  <!-- pendant bonds -->
  <g stroke="#A6884F" stroke-width="1" opacity="0.5">
    <line x1="140" y1="126" x2="140" y2="112"/>
    <line x1="300" y1="126" x2="300" y2="112"/>
    <line x1="460" y1="126" x2="460" y2="112"/>
    <line x1="620" y1="126" x2="620" y2="112"/>
  </g>
</svg>
