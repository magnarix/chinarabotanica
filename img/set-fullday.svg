<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <rect width="800" height="520" fill="#F5F2EE"/>
  <ellipse cx="400" cy="280" rx="340" ry="200" fill="#EBE8E3" opacity="0.4"/>

  <!-- Five tins in a row, slightly overlapping -->
  <!-- Tin 1 — Refresh -->
  <g transform="translate(120, 0)">
    <ellipse cx="0" cy="410" rx="38" ry="5" fill="#D8D2CA" opacity="0.4"/>
    <rect x="-38" y="180" width="76" height="220" rx="2" fill="#E8E3DC"/>
    <rect x="-38" y="180" width="2" height="220" fill="#F0ECE7"/>
    <rect x="36" y="180" width="2" height="220" fill="#D6D0C8"/>
    <ellipse cx="0" cy="180" rx="38" ry="10" fill="#EDE9E3"/>
    <ellipse cx="0" cy="400" rx="38" ry="10" fill="#DDD8D1"/>
    <rect x="-38" y="280" width="76" height="3" fill="#C8DDD0"/>
    <text x="0" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#6B6560">Refresh</text>
  </g>

  <!-- Tin 2 — Daily -->
  <g transform="translate(260, 0)">
    <ellipse cx="0" cy="410" rx="38" ry="5" fill="#D8D2CA" opacity="0.4"/>
    <rect x="-38" y="180" width="76" height="220" rx="2" fill="#E8E3DC"/>
    <rect x="-38" y="180" width="2" height="220" fill="#F0ECE7"/>
    <rect x="36" y="180" width="2" height="220" fill="#D6D0C8"/>
    <ellipse cx="0" cy="180" rx="38" ry="10" fill="#EDE9E3"/>
    <ellipse cx="0" cy="400" rx="38" ry="10" fill="#DDD8D1"/>
    <rect x="-38" y="280" width="76" height="3" fill="#E8C4A0"/>
    <text x="0" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#6B6560">Daily</text>
  </g>

  <!-- Tin 3 — Study (center, slightly taller) -->
  <g transform="translate(400, -10)">
    <ellipse cx="0" cy="420" rx="40" ry="6" fill="#D8D2CA" opacity="0.5"/>
    <rect x="-40" y="175" width="80" height="235" rx="2" fill="#E8E3DC"/>
    <rect x="-40" y="175" width="2" height="235" fill="#F0ECE7"/>
    <rect x="38" y="175" width="2" height="235" fill="#D6D0C8"/>
    <ellipse cx="0" cy="175" rx="40" ry="11" fill="#EDE9E3"/>
    <ellipse cx="0" cy="410" rx="40" ry="11" fill="#DDD8D1"/>
    <rect x="-40" y="282" width="80" height="3" fill="#5A7A5A"/>
    <text x="0" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#4A4540">Study</text>
  </g>

  <!-- Tin 4 — Post-Meal -->
  <g transform="translate(540, 0)">
    <ellipse cx="0" cy="410" rx="38" ry="5" fill="#D8D2CA" opacity="0.4"/>
    <rect x="-38" y="180" width="76" height="220" rx="2" fill="#E8E3DC"/>
    <rect x="-38" y="180" width="2" height="220" fill="#F0ECE7"/>
    <rect x="36" y="180" width="2" height="220" fill="#D6D0C8"/>
    <ellipse cx="0" cy="180" rx="38" ry="10" fill="#EDE9E3"/>
    <ellipse cx="0" cy="400" rx="38" ry="10" fill="#DDD8D1"/>
    <rect x="-38" y="280" width="76" height="3" fill="#B8907A"/>
    <text x="0" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#6B6560">Post-Meal</text>
  </g>

  <!-- Tin 5 — Evening -->
  <g transform="translate(680, 0)">
    <ellipse cx="0" cy="410" rx="38" ry="5" fill="#D8D2CA" opacity="0.4"/>
    <rect x="-38" y="180" width="76" height="220" rx="2" fill="#E8E3DC"/>
    <rect x="-38" y="180" width="2" height="220" fill="#F0ECE7"/>
    <rect x="36" y="180" width="2" height="220" fill="#D6D0C8"/>
    <ellipse cx="0" cy="180" rx="38" ry="10" fill="#EDE9E3"/>
    <ellipse cx="0" cy="400" rx="38" ry="10" fill="#DDD8D1"/>
    <rect x="-38" y="280" width="76" height="3" fill="#D4C48C"/>
    <text x="0" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#6B6560">Evening</text>
  </g>

  <!-- Brand text -->
  <text x="400" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#9A9490" letter-spacing="0.15em">THE FULL DAY SET</text>
  <text x="400" y="488" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="8" fill="#B5B0AA" letter-spacing="0.1em">CHINARA BOTANICA</text>
</svg>
