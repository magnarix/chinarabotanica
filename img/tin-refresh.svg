<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <!-- Soft ambient background -->
  <rect width="400" height="520" fill="#F5F2EE"/>
  <ellipse cx="200" cy="260" rx="180" ry="200" fill="#EBE8E3" opacity="0.5"/>

  <!-- Shadow beneath tin -->
  <ellipse cx="200" cy="430" rx="58" ry="8" fill="#D8D2CA" opacity="0.5"/>

  <!-- Cylindrical tin — body -->
  <rect x="142" y="160" width="116" height="260" rx="2" fill="#E8E3DC"/>
  <!-- Left edge highlight -->
  <rect x="142" y="160" width="3" height="260" fill="#F0ECE7" rx="1"/>
  <!-- Right edge shadow -->
  <rect x="255" y="160" width="3" height="260" fill="#D6D0C8" rx="1"/>

  <!-- Tin top — ellipse -->
  <ellipse cx="200" cy="160" rx="58" ry="14" fill="#EDE9E3"/>
  <ellipse cx="200" cy="160" rx="58" ry="14" stroke="#D6D0C8" stroke-width="0.5" fill="none"/>

  <!-- Tin bottom -->
  <ellipse cx="200" cy="420" rx="58" ry="14" fill="#DDD8D1"/>

  <!-- Color band — Refresh mint -->
  <rect x="142" y="270" width="116" height="3" fill="#C8DDD0"/>
  <rect x="142" y="280" width="116" height="40" fill="#C8DDD0" opacity="0.12"/>

  <!-- Label area -->
  <text x="200" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#9A9490" letter-spacing="0.15em">CHINARA BOTANICA</text>
  <text x="200" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#4A4540">Refresh</text>
  <text x="200" y="360" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="8" fill="#9A9490" letter-spacing="0.12em">MORNING RITUAL</text>

  <!-- Subtle botanical line art — leaf sprig -->
  <g transform="translate(200, 230)" stroke="#C8DDD0" stroke-width="0.7" fill="none" opacity="0.6">
    <line x1="0" y1="10" x2="0" y2="-15"/>
    <path d="M0,-5 Q-8,-12 -6,-18"/>
    <path d="M0,-5 Q8,-12 6,-18"/>
    <path d="M0,0 Q-10,-5 -9,-12"/>
    <path d="M0,0 Q10,-5 9,-12"/>
    <circle cx="0" cy="-15" r="1.5" fill="#C8DDD0" stroke="none"/>
  </g>

  <!-- Soft light reflection on tin -->
  <rect x="160" y="180" width="20" height="100" rx="10" fill="white" opacity="0.06"/>
</svg>
